title = "Відновлення пароля"
url = "/forgot-password"
layout = "default"

[resetPassword]
==
<div class="flex-grow flex items-center justify-center py-10 px-4">
    <div class="w-full max-w-[310px] bg-white rounded-[2px] shadow-sm border border-gray-200 p-5">
        <h2 class="text-base font-bold text-gray-800 text-center mb-3">
            Вислати контрольний рядок
        </h2>

        <form data-request="onRestorePassword" class="space-y-2.5 text-xs">
            <div>
                <label class="block text-[11px] text-gray-600 mb-0.5">Логін або E-mail</label>
                <input type="text" name="email" required
                    class="w-full px-2 py-1 border border-gray-300 rounded-[2px] text-xs focus:outline-none focus:border-[#0080c6] bg-gray-50 focus:bg-white transition">
            </div>

            <div class="border border-gray-200 bg-[#f9f9f9] rounded-[2px] p-2 flex items-center justify-between w-56 my-1.5">
                <label class="flex items-center gap-2 cursor-pointer text-[11px] text-gray-700 select-none">
                    <input type="checkbox" required class="w-4 h-4 rounded-[2px] text-[#0080c6] border-gray-300">
                    <span>I'm not a robot</span>
                </label>
                <div class="flex flex-col items-center">
                    <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" class="w-5 h-5 opacity-70">
                    <span class="text-[7px] text-gray-400">reCAPTCHA</span>
                </div>
            </div>

            <div class="pt-1">
                <button type="submit" 
                    class="px-4 py-1.5 bg-[#0080c6] hover:bg-[#0070ad] text-white text-xs font-medium rounded-[2px] transition">
                    Вислати
                </button>
            </div>

            <div class="pt-3 border-t border-gray-100 text-center">
                <a href="/login" class="text-[11px] font-medium text-[#0080c6] hover:underline">Авторизація</a>
            </div>
        </form>
    </div>
</div>
